architectury {
    common rootProject.enabled_platforms.split(",")
}

loom {
    accessWidenerPath = file("src/main/resources/arc.accesswidener")
}

dependencies {
    // Fabric @Environment 어노테이션과 Mixin 의존성을 쓰기 위해 여기서 Fabric 로더에 의존한다
    // Fabric 로더의 다른 클래스는 쓰지 않는다
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    api "dev.architectury:architectury:${project.architectury_version}"

    implementation files(rootProject.file("../UILib-26.2/fabric/build/libs/uilib-2.1.4-26.2-fabric.jar"))
    implementation files(rootProject.file("../YamlConfig-26.2/fabric/build/libs/yamlconfig-1.3.2-26.2-fabric.jar"))
}
