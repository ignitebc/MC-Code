plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")

    runs {
        client {
            // 내장 기본 팩은 첫 리소스 리로드 때 메모리가 더 필요하다.
            vmArg "-Xmx768m"
        }
        server {
            vmArg "-Xmx384m"
        }
        datagen {
            property "fabric-api.datagen.modid", "tacz"
        }
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    implementation("com.maydaymemory:mae:1.1.1") {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    implementation(include('org.apache.commons:commons-math3:3.6.1'))
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // TaCZ 설정 클래스는 Fabric 포트를 통해 ForgeConfigSpec을 쓴다.
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    inputs.property "supported_minecraft_versions", project.supported_minecraft_versions
    inputs.property "java_version", project.java_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.fabric_loader_version,
                "supported_minecraft_versions": project.supported_minecraft_versions,
                "java_version": project.java_version
    }
}

def targetJavaVersion = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
    it.options.compilerArgs << "-Xmaxerrs" << "5000"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-${minecraft_version}"
            from components.java
        }
    }
}
