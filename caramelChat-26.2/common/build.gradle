dependencies {
    // fabric @Environment 어노테이션을 쓰고 mixin 의존성을 얻으려고 여기서 fabric loader에 의존한다
    // fabric loader의 다른 클래스는 쓰지 않는다
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

architectury {
    common("fabric")
}

loom {
    accessWidenerPath = file("src/main/resources/caramelchat.accesswidener")
    mixin { defaultRefmapName = "caramelchat-common.refmap.json" }
}
