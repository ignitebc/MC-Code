plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = 'com.mcserver.serverutilities'
base { archivesName = "ServerUtilities-${minecraft_version}" }

jar { from('LICENSE', 'LICENSE-APACHE-2.0', 'NOTICE') }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('regressionTest', JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.mcserver.serverutilities.RegressionTests'
}
check.dependsOn regressionTest
