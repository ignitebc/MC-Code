//file:noinspection GroovyAssignabilityCheck
//file:noinspection DependencyNotationArgument
//file:noinspection GrDeprecatedAPIUsage
plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    //noinspection GroovyAccessibility
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // 이 설정의 파일은 Shadow 플러그인으로 모드에 함께 묶인다.
    // 플러그인 자체의 `shadow` 설정은 파일을 빼는 용도이므로 쓰지 않는다.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    api "dev.architectury:architectury-fabric:${project.architectury_version}"

    common(project(path: ":common", configuration: "runtimeElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    implementation files(rootProject.file("../YamlConfig-26.2/fabric/build/libs/yamlconfig-1.3.2-26.2-fabric.jar"))
    implementation files(rootProject.file("../ArcLib-26.2/fabric/build/libs/arc-1.9.7-26.2-fabric.jar"))
    implementation files(rootProject.file("../ItemRestrictions-26.2/fabric/build/libs/itemrestrictions-1.3.4-26.2-fabric.jar"))
    implementation files(rootProject.file("../UILib-26.2/fabric/build/libs/uilib-2.1.4-26.2-fabric.jar"))
    // 펫관리 탭이 펫 목록·패킷을 직접 쓴다. 수집 스크립트가 Advanced Netherite를 먼저 빌드한다.
    implementation files(rootProject.file("../AdvancedNetherite-26.2/Fabric/build/libs/advancednetherite-fabric-2.4.2-26.2.jar"))
    implementation files(rootProject.file("../ServerUtilities-26.2/build/libs/ServerUtilities-26.2-1.0.1.jar"))
}

processResources {
    var replaceProperties = [
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_author": project.mod_author,
            "mod_license": project.mod_license,
            "mod_website": project.mod_website,
            "mod_repository": project.mod_repository,

            "fabric_loader_version": project.fabric_loader_version,
            "fabric_api_version": project.fabric_api_version,
            "minecraft_version": project.minecraft_version,
            "java_version": project.java_version,
            "architectury_version": project.architectury_version,
            "config_library_version": project.config_library_version,
            "arc_version": project.arc_version,
            "item_restrictions_version": project.item_restrictions_version,
            "ui_library_version": project.ui_library_version
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "fabric"
}

sourcesJar {
    archiveClassifier = "fabric-sources"
}

